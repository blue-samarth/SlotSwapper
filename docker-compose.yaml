version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: slotswapper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: slotswapper_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slotswapper-network

  # Backend Go API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: slotswapper-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Server Configuration
      PORT: 8080
      GIN_MODE: release
      ENVIRONMENT: production
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: slotswapper_dev
      DB_SSLMODE: disable
      
      # JWT Configuration
      JWT_SECRET: your-super-secret-jwt-key-change-in-production-32-chars
      JWT_EXPIRATION_HOURS: 24
      
      # CORS Configuration (allow frontend container and localhost)
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://frontend,http://frontend:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/slotswapper", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - slotswapper-network

  # Frontend Vue.js + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: slotswapper-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - slotswapper-network

volumes:
  postgres_data:
    driver: local

networks:
  slotswapper-network:
    driver: bridge
